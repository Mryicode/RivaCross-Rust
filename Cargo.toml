[package]
name = "rivacross"
version = "0.1.0"
edition = "2024"
description = "Windows RTSS crosshair editor"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
raw-window-handle = "0.6"
tray-icon = "0.20"
global-hotkey = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
winit = { version = "0.30", default-features = false }

[features]
ui-capture = ["eframe/__screenshot"]

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# eframe 0.31.1 leaves the Windows loop polling when a hidden window cannot paint.
eframe = { path = "vendor/eframe" }
